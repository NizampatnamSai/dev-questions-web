<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DevQuiz Notes</title>
  <style>
    :root { color-scheme: dark; }
    body {
      width: 340px; margin: 0; padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    h1 { font-size: 14px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    label { font-size: 11px; color: #94a3b8; display: block; margin: 8px 0 4px; }
    input, textarea, select {
      width: 100%; box-sizing: border-box; padding: 7px 8px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05);
      color: #e2e8f0; font-size: 12px; outline: none;
    }
    textarea { resize: vertical; min-height: 70px; font-family: inherit; }
    input:focus, textarea:focus, select:focus { border-color: #6366f1; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    button {
      width: 100%; margin-top: 10px; padding: 9px; border: none; border-radius: 8px;
      background: #6366f1; color: white; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: rgba(255,255,255,0.08); }
    button.secondary:hover { background: rgba(255,255,255,0.14); }
    .meta { font-size: 10px; color: #64748b; word-break: break-all; margin-top: 2px; }
    .error { color: #f87171; font-size: 11px; margin-top: 6px; }
    .success { color: #34d399; font-size: 11px; margin-top: 6px; }
    .hint { font-size: 10px; color: #64748b; margin-top: 8px; line-height: 1.4; }
    a { color: #818cf8; }
    .top-row { display: flex; justify-content: space-between; align-items: center; }
    .logout { font-size: 10px; color: #64748b; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="top-row">
    <h1>📝 DevQuiz Notes</h1>
    <span id="logoutBtn" class="logout" style="display:none;">Log out</span>
  </div>

  <div id="loginView" style="display:none;">
    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="you@example.com" />
    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="Your DevQuiz account password" />
    <button id="loginBtn">Log In</button>
    <div id="loginError" class="error"></div>
    <p class="hint">This is your regular DevQuiz account login — separate from your Notes passphrase, which you'll enter next.</p>
  </div>

  <div id="saveView" style="display:none;">
    <label>Title</label>
    <input id="clipTitle" type="text" placeholder="Note title" />

    <label>Clipped text</label>
    <textarea id="clipText" placeholder="Select text on a page, right-click, and choose 'Save to DevQuiz Notes' — or paste text here directly."></textarea>

    <div class="meta" id="clipMeta"></div>

    <label>Importance</label>
    <select id="clipImportance">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>

    <label>Notes passphrase</label>
    <input id="passphrase" type="password" placeholder="Never stored — used only to encrypt this note" />

    <button id="saveBtn">Save to Notes</button>
    <div id="saveError" class="error"></div>
    <div id="saveSuccess" class="success"></div>
    <p class="hint">Encrypted in your browser before it ever leaves this extension — the server never sees your passphrase or the plaintext.</p>
  </div>

  <script src="crypto.js"></script>
  <script src="popup.js"></script>
</body>
</html>
